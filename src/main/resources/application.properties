spring.application.name=biblioteca-api
server.port=8080

# Base de datos en memoria H2 (se borra al apagar la app)
spring.datasource.url=jdbc:h2:mem:bibliotecadb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea las tablas a partir de las entidades; data.sql corre después
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true

# Consola web de H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true
